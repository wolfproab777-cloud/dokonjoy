<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Do'konlar Joylashuvi</title>
    
    <!-- Leaflet CSS va JS (Xarita uchun) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Routing Machine (Marshrut chizish uchun) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; font-family: Arial, sans-serif; width: 100%; height: 100%; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        
        /* Tillar paneli */
        .lang-switcher {
            position: fixed; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 5px; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; gap: 5px;
        }
        .lang-switcher button {
            border: none; background: #f0f0f0; cursor: pointer; font-size: 14px; 
            padding: 5px 8px; border-radius: 4px; font-weight: bold; transition: 0.2s;
        }
        .lang-switcher button:active { background: #d1d5db; }

        /* GPS Status panel */
        #status-panel {
            position: fixed; top: 10px; left: 10px; z-index: 1000;
            background: white; padding: 8px 12px; border-radius: 6px; 
            font-size: 12px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Operator Call tugmasi */
        .call-btn {
            position: fixed; bottom: 25px; right: 25px; z-index: 1000;
            background-color: #2563eb; color: white; border-radius: 50%;
            width: 60px; height: 60px; display: flex; justify-content: center;
            align-items: center; text-decoration: none; font-size: 28px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
        }

        /* Login Modal oynasi */
        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999; display: flex;
            justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 25px; border-radius: 12px;
            width: 80%; max-width: 320px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .login-box input {
            width: 90%; padding: 12px; margin: 12px 0; font-size: 16px;
            border: 1px solid #ccc; border-radius: 8px; outline: none;
        }
        .login-box button {
            width: 98%; padding: 12px; background: #2563eb; color: white; font-size: 16px;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        
        .leaflet-routing-container { display: none !important; } /* marshrut yozuvlarini yashirish */
    </style>
</head>
<body>

    <!-- GPS Holati -->
    <div id="status-panel">📍 Joylashuv aniqlanmoqda...</div>

    <!-- Tilni o'zgartirish paneli -->
    <div class="lang-switcher">
        <button onclick="changeLang('uz')">UZ</button>
        <button onclick="changeLang('ru')">RU</button>
        <button onclick="changeLang('en')">EN</button>
    </div>

    <!-- Login va SMS kiritish oynasi -->
    <div id="login-modal">
        <div class="login-box">
            <h3 id="login-title" style="margin-top:0; color:#1f2937;">Tizimga kirish</h3>
            
            <!-- 1-qadam: Raqam -->
            <div id="phone-step">
                <input type="tel" id="phone-number" placeholder="+998 90 123 45 67">
                <button onclick="sendSMS()" id="btn-sms">SMS Kod Yuborish</button>
            </div>
            
            <!-- 2-qadam: SMS Kod -->
            <div id="code-step" style="display:none;">
                <p id="code-desc" style="font-size:14px; color:#4b5563;">Raqamingizga kelgan 6 xonali kodni kiriting:</p>
                <input type="number" id="sms-code" placeholder="123 456">
                <button onclick="verifySMS()" id="btn-verify" style="background:#10b981;">Tasdiqlash va Kirish</button>
            </div>
        </div>
    </div>

    <!-- Operatorga qo'ng'iroq qilish -->
    <a href="tel:200118035" class="call-btn">📞</a>

    <!-- Xarita konteyneri -->
    <div id="map"></div>

    <script>
        // 1. TIL SOZLAMALARI (O'zbek, Rus, Ingliz)
        const dict = {
            uz: { statusLoad: "📍 Joylashuv aniqlanmoqda...", statusDone: "✅ Joylashuv aniqlandi", login: "Tizimga kirish", btnSms: "SMS Kod Yuborish", codeDesc: "6 xonali kodni kiriting:", btnVerify: "Tasdiqlash va Kirish", car: "🚗 Mashinada", foot: "🚶‍♂️ Piyoda" },
            ru: { statusLoad: "📍 Поиск локации...", statusDone: "✅ Локация найдена", login: "Вход в систему", btnSms: "Отправить SMS", codeDesc: "Введите 6-значный код:", btnVerify: "Подтвердить", car: "🚗 На авто", foot: "🚶‍♂️ Пешком" },
            en: { statusLoad: "📍 Finding location...", statusDone: "✅ Location found", login: "Login", btnSms: "Send SMS Code", codeDesc: "Enter 6-digit code:", btnVerify: "Verify & Enter", car: "🚗 By Car", foot: "🚶‍♂️ On Foot" }
        };

        let currentLang = localStorage.getItem('appLang') || 'uz';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang);
            
            document.getElementById('login-title').innerText = dict[lang].login;
            document.getElementById('btn-sms').innerText = dict[lang].btnSms;
            document.getElementById('code-desc').innerText = dict[lang].codeDesc;
            document.getElementById('btn-verify').innerText = dict[lang].btnVerify;
            
            let statText = document.getElementById('status-panel').innerText;
            if(statText.includes("📍") || statText.includes("Поиск") || statText.includes("Finding")) {
                document.getElementById('status-panel').innerText = dict[lang].statusLoad;
            } else {
                document.getElementById('status-panel').innerText = dict[lang].statusDone;
            }
            loadShopsToMap(); // Til o'zgarganda xaritadagi yozuvlar ham o'zgaradi
        }
        changeLang(currentLang);

        // 2. LOGIN (Avtorizatsiya) LOGIKASI
        if (localStorage.getItem('isLogged') === 'true') {
            document.getElementById('login-modal').style.display = 'none';
            startGPS(); // Agar avval kirgan bo'lsa, to'g'ridan-to'g'ri GPS ni yoqish
        }

        function sendSMS() {
            let phone = document.getElementById('phone-number').value;
            if(phone.length >= 9) {
                // Bu yerga kelajakda kiritilgan raqamga SMS jo'natish API si ulanadi
                document.getElementById('phone-step').style.display = 'none';
                document.getElementById('code-step').style.display = 'block';
            } else {
                alert("Telefon raqamni to'liq kiriting!");
            }
        }

        function verifySMS() {
            let code = document.getElementById('sms-code').value;
            if(code.length > 0) { // Test uchun ixtiyoriy kod qabul qilinadi
                localStorage.setItem('isLogged', 'true');
                document.getElementById('login-modal').style.display = 'none';
                startGPS(); // Tizimga kirgach xarita va GPS ni ishga tushirish
            }
        }

        // 3. XARITA VA GPS LOGIKASI
        let map = L.map('map').setView([41.2995, 69.2401], 12); // Toshkent markazi (Default)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);
        
        let userLat = null;
        let userLng = null;
        let userMarker = null;
        let routingControl = null;

        function startGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;
                        
                        map.setView([userLat, userLng], 14);
                        if(userMarker) map.removeLayer(userMarker);
                        userMarker = L.marker([userLat, userLng]).addTo(map).bindPopup("<b>Siz shu yerdasiz!</b>").openPopup();
                        
                        document.getElementById('status-panel').innerText = dict[currentLang].statusDone;
                        loadShopsToMap();
                    },
                    (error) => {
                        console.error("GPS Xatosi: ", error);
                        document.getElementById('status-panel').innerText = "❌ GPS Ruxsati yo'q";
                        alert("Iltimos, ilova sozlamalaridan joylashuvga (Location) ruxsat bering!");
                        loadShopsToMap(); // Joylashuv topilmasa ham do'konlarni ko'rsatish
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        // 4. DO'KONLAR BAZASI VA MARSHRUT
        const shopsData = [
            { id: 1, name: "Asosiy Do'kon (Chilonzor)", lat: 41.2753, lng: 69.2066 },
            { id: 2, name: "Filial 1 (Yunusobod)", lat: 41.3644, lng: 69.2842 },
            { id: 3, name: "Filial 2 (M.Ulug'bek)", lat: 41.3265, lng: 69.3243 }
        ];

        function loadShopsToMap() {
            shopsData.forEach(shop => {
                let popupHtml = `
                    <div style="text-align:center; min-width:120px;">
                        <h4 style="margin:0 0 10px 0; color:#1e3a8a;">${shop.name}</h4>
                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <button onclick="drawRouteToShop(${shop.lat}, ${shop.lng}, 'car')" style="background:#2563eb; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">
                                ${dict[currentLang].car}
                            </button>
                            <button onclick="drawRouteToShop(${shop.lat}, ${shop.lng}, 'foot')" style="background:#10b981; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">
                                ${dict[currentLang].foot}
                            </button>
                        </div>
                    </div>
                `;
                L.marker([shop.lat, shop.lng]).addTo(map).bindPopup(popupHtml);
            });
        }

        window.drawRouteToShop = function(destLat, destLng, mode) {
            if (!userLat || !userLng) {
                alert("GPS aniqlanmagan! Marshrut chizish uchun GPS yoniq bo'lishi kerak.");
                return;
            }
            
            if (routingControl) {
                map.removeControl(routingControl); // Avvalgi marshrutni tozalash
            }
            
            let profileType = (mode === 'foot') ? 'foot' : 'car';
            let lineColor = (mode === 'foot') ? '#10b981' : '#2563eb';

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(userLat, userLng),
                    L.latLng(destLat, destLng)
                ],
                router: L.Routing.osrmv1({
                    serviceUrl: `https://router.project-osrm.org/route/v1/${profileType}`
                }),
                lineOptions: {
                    styles: [{ color: lineColor, opacity: 0.8, weight: 6 }]
                },
                createMarker: function() { return null; } // O'rtadagi ortiqcha belgilarni olib tashlash
            }).addTo(map);
            
            map.closePopup(); // Marshrut chizilgach popupni yopish
        };
    </script>
</body>
</html>
